name: Run tests

# Тригер
on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest
    steps: # шаги конкретной job
      - name: Checkout repository # копируем файлы репозитория внутрь CI агента
        uses: actions/checkout@v4


      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys:
            ${{ runner.os }}-maven-

      - name: Set up services
        run: cd infra/docker_compose && bash restart_docker.sh && cd ../..

      - name: Grant execute permission for scripts
        run: chmod +x mvnw run-tests.sh infra/docker_compose/restart_docker.sh

      - name: Checkstyle only (no tests)
        run: mvn -DskipTests=true verify

      - name: Run tests in Docker (api + ui)
        env:
          DOCKER_NETWORK: nbank-network
          APIBASEURL: http://backend:4111
          UIBASEURL: http://frontend
          UIREMOTE: http://selenoid:4444/wd/hub
        run: |
          bash run-tests.sh api
          SKIP_BUILD=1 bash run-tests.sh ui

      - name: Run Swagger coverage
        if: always()
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s http://localhost:4111/v3/api-docs -i target/swagger-coverage-outputts

      - name: Load test report history
        uses: actions/checkout@v2
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          gh_pages: gh-pages
          allure_results: target/allure-results
          allure_history: allure-history

      - name: Build Swagger coverage report
        if: always()
        run: sudo cp swagger-coverage-report.html allure-history/${{ github.run_number }}

      - name: Publish test report
        uses: peaceiris/action-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

        # Логин в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Сборка и пуш Docker-образа с тегом commit hash
      - name: Build and push Docker image
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/testnbank

          docker build -t $IMAGE_NAME:$COMMIT_HASH .
          docker push $IMAGE_NAME:$COMMIT_HASH  

      - name: Clean up services
        if: always()
        run: docker compose down
